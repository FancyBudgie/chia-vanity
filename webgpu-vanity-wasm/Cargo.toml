[package]
name = "webgpu-vanity-wasm"
version = "0.1.0"
edition = "2024"
publish = false
description = "WebGPU accelerated unhardened Chia vanity address search"
license = "MIT"
repository = "https://github.com/FancyBudgie/chia-vanity"

[lib]
name = "webgpu_vanity_wasm"
crate-type = ["cdylib"]

[workspace]

[dependencies]
blstrs = { package = "nam-blstrs", version = "0.7.1-nam.0" }
group = "0.13.0"
num-bigint = "0.4.6"
wasm-bindgen = "0.2.113"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
lto = true
