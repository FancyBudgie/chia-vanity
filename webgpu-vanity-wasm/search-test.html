<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>Vanity WebGPU differential test</title></head>
<body>
    <button id="run">Run differential test</button>
    <pre id="output">Ready.</pre>
    <script type="module">
        import initGpu, { WebGpuVanitySearch } from './pkg/webgpu_vanity_wasm.js';
        import initSdk, {
            Address,
            SecretKey,
            standardPuzzleHash,
        } from '/vendor-pkg/chia-wallet-sdk-wasm/chia_wallet_sdk_wasm.js';

        const output = document.querySelector('#output');
        document.querySelector('#run').addEventListener('click', async () => {
            output.textContent = 'Running…';
            try {
                await Promise.all([initGpu(), initSdk()]);
                const seed = new Uint8Array(32).fill(7);
                const masterSk = SecretKey.fromSeed(seed);
                const masterPk = masterSk.publicKey();
                const accountPk = masterPk.deriveUnhardenedPath([12381, 8444, 2]);
                const gpu = await WebGpuVanitySearch.create(accountPk.toBytes());
                const count = 4096;
                const start = 4096;
                const gpuChildBytes = await gpu.deriveChildPublicKeys(start, count);
                const gpuBytes = await gpu.deriveSyntheticPublicKeys(start, count);
                const gpuPuzzleHashes = await gpu.derivePuzzleHashes(start, count);
                const childMismatches = [];
                const mismatches = [];
                const puzzleHashMismatches = [];
                const nativeSearchMismatches = [];

                for (let index = 0; index < count; index += 1) {
                    const child = accountPk.deriveUnhardened(start + index);
                    const synthetic = child.deriveSynthetic();
                    const expectedChild = child.toBytes();
                    const expected = synthetic.toBytes();
                    const actualChild = gpuChildBytes.slice(index * 48, (index + 1) * 48);
                    const actual = gpuBytes.slice(index * 48, (index + 1) * 48);
                    const expectedPuzzleHash = standardPuzzleHash(synthetic);
                    const actualPuzzleHash = gpuPuzzleHashes.slice(index * 32, (index + 1) * 32);
                    if (!expectedChild.every((byte, offset) => byte === actualChild[offset])) {
                        childMismatches.push(index);
                    }
                    if (!expected.every((byte, offset) => byte === actual[offset])) {
                        mismatches.push(index);
                    }
                    if (!expectedPuzzleHash.every((byte, offset) => byte === actualPuzzleHash[offset])) {
                        puzzleHashMismatches.push(index);
                    }
                    synthetic.free();
                    child.free();
                }

                for (const index of [0, 1, 2, 31, 32, 63, 64, 255, 256, 4095, 65535, 1_000_000]) {
                    const child = accountPk.deriveUnhardened(index);
                    const synthetic = child.deriveSynthetic();
                    const address = new Address(standardPuzzleHash(synthetic), 'xch');
                    const expected = address.encode();
                    const nativeResult = await gpu.searchBatch(
                        index,
                        1,
                        1,
                        'xch',
                        expected.slice(0, -6),
                        expected.slice(-6),
                    );
                    if (nativeResult.hitIndex !== index) {
                        nativeSearchMismatches.push(index);
                    }
                    address.free();
                    synthetic.free();
                    child.free();
                }

                const stridedTargetIndex = 1_021;
                const stridedChild = accountPk.deriveUnhardened(stridedTargetIndex);
                const stridedSynthetic = stridedChild.deriveSynthetic();
                const stridedAddress = new Address(standardPuzzleHash(stridedSynthetic), 'xch');
                const stridedExpected = stridedAddress.encode();
                const stridedBatch = await gpu.searchBatch(
                    1_000,
                    4,
                    7,
                    'xch',
                    stridedExpected.slice(0, -6),
                    stridedExpected.slice(-6),
                );
                if (stridedBatch.hitIndex !== stridedTargetIndex) {
                    nativeSearchMismatches.push('strided');
                }
                stridedAddress.free();
                stridedSynthetic.free();
                stridedChild.free();

                const child0 = accountPk.deriveUnhardened(start);
                const synthetic0 = child0.deriveSynthetic();
                const address0 = new Address(standardPuzzleHash(synthetic0), 'xch');
                const expectedAddress = address0.encode();
                const exactBatch = await gpu.searchBatch(
                    start,
                    count,
                    1,
                    'xch',
                    expectedAddress.slice(0, -6),
                    expectedAddress.slice(-6),
                );
                const benchmark = await gpu.searchBatch(
                    1_000_000,
                    gpu.batchCapacity,
                    1,
                    'xch',
                    'xch1qqqqqqqq',
                    '',
                );
                const result = {
                    adapter: gpu.adapterName,
                    count,
                    start,
                    masterPublicKeyHex: Array.from(masterPk.toBytes(), byte => byte.toString(16).padStart(2, '0')).join(''),
                    childMismatches,
                    mismatches,
                    puzzleHashMismatches,
                    nativeSearchMismatches,
                    exactBatch,
                    benchmark,
                    benchmarkKeysPerSecond: Math.round(
                        benchmark.checked / (benchmark.elapsedMs / 1000),
                    ),
                    expectedAddress,
                    exactAddressMatches: exactBatch.hitIndex === start,
                    child0ExpectedHex: Array.from(child0.toBytes(), byte => byte.toString(16).padStart(2, '0')).join(''),
                    child0ActualHex: Array.from(gpuChildBytes.slice(0, 48), byte => byte.toString(16).padStart(2, '0')).join(''),
                };
                output.textContent = JSON.stringify(result, null, 2);
                document.title = childMismatches.length === 0 &&
                    mismatches.length === 0 &&
                    puzzleHashMismatches.length === 0 &&
                    nativeSearchMismatches.length === 0 &&
                    result.exactAddressMatches
                    ? 'DONE - GPU differential test'
                    : 'FAILED - GPU differential test';
                address0.free();
                synthetic0.free();
                child0.free();
                gpu.free();
                accountPk.free();
                masterPk.free();
                masterSk.free();
            } catch (error) {
                output.textContent = error?.stack || String(error);
                document.title = 'FAILED - GPU differential test';
            }
        });
    </script>
</body>
</html>
